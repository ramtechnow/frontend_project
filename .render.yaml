services:
  - type: web
    name: ecommerce-backend
    env: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: static
    name: frontend-project
    rootDir: frontend_project
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://ecommerce-backend.onrender.com
